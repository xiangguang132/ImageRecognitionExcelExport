<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生证识别系统 — 应用流程图（学生免登录 · 管理员登录）</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f8f9fc;
    --border: #e2e5ee;
    --accent2: #10b981;
    --text: #1e293b;
    --text2: #64748b;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e3ead1;
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 8px;
    min-height: 100vh;
    line-height: 1.6;
  }
  .page { background: #fff; border-radius: 22px; overflow: hidden; max-width: 1800px; margin: 0 auto; zoom: .68; }
  .browser { display: flex; align-items: center; gap: 14px; background: #f3f4f6; padding: 10px 22px; }
  .browser .sk { background: #e2e3e7; border-radius: 6px; }
  .browser .left .sk { height: 14px; } .browser .left .sk:first-child { width: 150px; margin-bottom: 8px; } .browser .left .sk:last-child { width: 90px; }
  .browser .mid { flex: 1; display: flex; justify-content: center; gap: 12px; } .browser .mid .sk { width: 44px; height: 36px; border-radius: 8px; }
  .browser .right { display: flex; align-items: center; } .browser .right i { width: 44px; height: 44px; border-radius: 50%; background: #ddd; display: block; margin-left: -10px; border: 3px solid #f3f4f6; } .browser .right .sk { width: 96px; height: 38px; border-radius: 10px; margin-left: 46px; }
  .content { padding: 10px 26px 14px; }
  h1 { text-align: center; font-size: 21px; font-weight: 700; line-height: 1.4; margin-bottom: 2px; }
  .subtitle { text-align: center; color: #1e293b; font-size: 14px; margin-bottom: 8px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .section-title .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .diagram-wrapper {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 8px;
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }
  .footer { text-align: center; color: #1e293b; font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .nav { text-align: center; margin-bottom: 8px; font-size: 14px; color: #1e293b; }
  .nav a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
  @media (max-width: 768px) { body { padding: 24px 16px; } .diagram-wrapper { padding: 20px; } }
  @media print { body { max-width: none; } .diagram-wrapper { break-inside: avoid; box-shadow: none; } }
</style>
</head>
<body>
<div class="page">
<div class="browser"><div class="left"><div class="sk"></div><div class="sk"></div></div><div class="mid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="right"><i></i><i></i><i></i><div class="sk"></div></div></div>
<div class="content">

<div class="diagram-wrapper">

    <defs>
      <marker id="ah" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#4b5563"/>

    <!-- ===== 顶部：用户 ===== -->

    <rect x="32" y="154" width="1152" height="262" fill="#ffffff"/>

    <rect x="80" y="195" width="520" height="210" fill="#ffffff" stroke="#d8dce3" stroke-width="1"/>
    <g transform="translate(100,207)" style="color:#2f6bf6">

    <text x="340" y="225" text-anchor="middle" fill="#111111" font-size="14" font-weight="600">UI · Web 前端 · Service 后端</text>

    <!-- UI -->
    <rect x="100" y="252" width="230" height="136" fill="#edf1fd"/>
    <g transform="translate(195,264)" style="color:#2f6bf6">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="2" width="22" height="16" rx="1"/><line x1="0" y1="8" x2="22" y2="8"/><line x1="8" y1="12.5" x2="14" y2="12.5"/>

      </g>
    </g>
    <text x="906" y="296" text-anchor="middle" fill="#111111" font-size="16">Database</text>
    <text x="906" y="315" text-anchor="middle" fill="#1f2937" font-size="13">Prisma · SQLite</text>
    <text x="906" y="335" text-anchor="middle" fill="#b45309" font-size="13">ExcelJS 导出（仅管理员）</text>

    <!-- Service → DB -->
    <line x1="600" y1="298" x2="778" y2="298" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>
    <text x="689" y="290" text-anchor="middle" fill="#374151" font-size="13">写入数据</text>

    <line x1="560" y1="72" x2="560" y2="192" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>

    <line x1="656" y1="192" x2="656" y2="72" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>

    <line x1="400" y1="396" x2="400" y2="434" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>
    <text x="366" y="421" text-anchor="middle" fill="#374151" font-size="13">调用 API</text>
    <line x1="490" y1="434" x2="490" y2="396" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>
    <text x="522" y="421" text-anchor="middle" fill="#374151" font-size="13">返回结果</text>
    <!-- DB → 下层 -->
    <line x1="906" y1="396" x2="906" y2="434" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>
    <text x="906" y="421" text-anchor="middle" fill="#374151" font-size="12">管理员查询 / 导出</text>

    <!-- ===== 中间：MaaS 层 ===== -->
    <rect x="32" y="442" width="1152" height="84" fill="#ffffff"/>
    <g transform="translate(330,466)" style="color:#2f6bf6">

        <path d="M15 2l11 6.5v13L15 28 4 21.5v-13z"/><path d="M4 8.5l11 6.5 11-6.5M15 15v13"/>
      </g>

    <text x="608" y="478" text-anchor="middle" fill="#111111" font-size="15">MaaS (Model as a Service) · DashScope</text>
    <text x="608" y="499" text-anchor="middle" fill="#374151" font-size="13">LLM (Large Language Model) · Tongyi Qianwen (Qwen) · Model Studio</text>

    <!-- MaaS → 底部两盒 -->
    <line x1="312" y1="526" x2="312" y2="556" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>
    <line x1="904" y1="526" x2="904" y2="556" stroke="#4b5563" stroke-width="1" marker-end="url(#ah)"/>

    <!-- ===== 底部两盒 ===== -->
    <rect x="32" y="564" width="560" height="118" fill="#ffffff"/>
    <g transform="translate(60,590)" style="color:#2f6bf6">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="14" height="18" rx="1"/><rect x="7" y="1" width="14" height="18" rx="1" fill="#ffffff"/><line x1="11" y1="8" x2="17" y2="8"/><line x1="11" y1="12" x2="17" y2="12"/>
      </g>
    </g>
    <text x="312" y="600" text-anchor="middle" fill="#111111" font-size="15">视觉识别(VLM) · Qwen-VL-Plus</text>
    <text x="312" y="620" text-anchor="middle" fill="#64748b" font-size="12">Vision-Language Model</text>
    <text x="312" y="641" text-anchor="middle" fill="#374151" font-size="14">拍照 / 上传 → Base64 推理</text>

    <rect x="624" y="564" width="560" height="118" fill="#ffffff"/>
    <g transform="translate(651,590)" style="color:#2f6bf6">

        <path d="M15 2l9 5v10l-9 5-9-5V7z"/><path d="M15 8l5 3v6l-5 3-5-3V11z"/>
      </g>
    </g>
    <text x="904" y="600" text-anchor="middle" fill="#111111" font-size="15">语音识别(ASR) · Qwen3.5-Omni-Flash</text>
    <text x="904" y="620" text-anchor="middle" fill="#64748b" font-size="12">Automatic Speech Recognition</text>
    <text x="904" y="641" text-anchor="middle" fill="#374151" font-size="14">边说边显示 + 后端多格式音频校准</text>
  </svg>
</div>
